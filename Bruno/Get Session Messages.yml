info:
  name: Get Session Messages
  type: http
  seq: 9

http:
  method: GET
  url: http://localhost:8000/chat/session/{{session_id}}/messages
  headers:
    - name: Authorization
      value: Bearer {{token}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
