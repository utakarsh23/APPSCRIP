info:
  name: Signup
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8000/auth/signup
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
          "username": "johndoe",
          "email": "john@example.com",
          "password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
